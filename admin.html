<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Learning Quest — Administrator Access</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap');
  :root{ --bg:#1B1640; --gold:#FFC94A; --coral:#FF6B5E; --green:#3DDC97; --cream:#FBF3DD; --plum:#2E2350; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Nunito', system-ui, -apple-system, sans-serif;
    background:var(--bg); color:var(--cream); min-height:100vh;
  }
  .display{ font-family:'Fredoka','Comic Sans MS', system-ui, sans-serif; }
  #app{ max-width:520px; margin:0 auto; padding:24px 18px 60px; }
  button{ font-family:inherit; }
  .card{ background:var(--plum); border-radius:20px; padding:16px; }
  .row{ display:flex; align-items:center; }
  .between{ justify-content:space-between; }
  .gap-2 > * + *{ margin-left:8px; }
  .gap-3 > * + *{ margin-left:12px; }
  .btn-primary{ width:100%; padding:14px; border-radius:14px; border:none; background:linear-gradient(135deg,var(--coral),var(--gold)); color:var(--plum); font-weight:800; font-size:15px; cursor:pointer; font-family:'Fredoka',sans-serif; }
  .btn-secondary{ width:100%; padding:12px; border-radius:14px; border:2px solid rgba(255,255,255,.2); background:none; color:var(--cream); font-weight:700; font-size:14px; cursor:pointer; }
  .link-btn{ background:none; border:none; color:var(--cream); text-decoration:underline; cursor:pointer; font-size:13px; opacity:.8; }
  a{ color:inherit; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* This is an intentionally simple, separate page from the main app — same
   Netlify site, its own file, gated by one shared password. It reads
   directly from Supabase, so it works regardless of which device/browser
   any student played on. "We'll do more with this later" per the user —
   for now this is a single shared password, not per-admin accounts. */

const SUPABASE_URL = "https://elgymzclvddcvsmipqoi.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZ3ltemNsdmRkY3ZzbWlwcW9pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4Mjg0OTcsImV4cCI6MjEwMTQwNDQ5N30.5WvhelM7r8t5meAWaz5OFT6wHp63LUQ9amDH_SO9D4o";
const ADMIN_PASSWORD = "test"; // placeholder for now, per user request — replace with something real before sharing this URL widely

async function sbFetch(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json" },
  });
  if (!res.ok) throw new Error(`Supabase GET ${path} failed: ${res.status}`);
  return res.json();
}

const escapeHtml = (str) => String(str).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

// Minimal topic lookup — just names/icons for display, no question banks needed here.
const TOPICS_BY_ID = {
  mult: { name: "Multiplication", icon: "\u2716\uFE0F" }, div: { name: "Division", icon: "\u2797" },
  addsub: { name: "Add & Subtract", icon: "\u2795" }, placevalue: { name: "Place Value", icon: "\uD83D\uDD22" },
  fractions: { name: "Fractions", icon: "\uD83E\uDD67" }, money: { name: "Money", icon: "\uD83D\uDCB0" },
  time: { name: "Telling Time", icon: "\uD83D\uDD70\uFE0F" }, measurement: { name: "Measure & Shapes", icon: "\uD83D\uDCCF" },
  wordproblems: { name: "Word Problems", icon: "\uD83E\uDDE9" }, pos: { name: "Parts of Speech", icon: "\uD83D\uDCDD" },
  synant: { name: "Synonyms & Antonyms", icon: "\uD83D\uDD01" }, sentences: { name: "Sentences & Punctuation", icon: "\uD83D\uDCAC" },
  vocab: { name: "Vocabulary Clues", icon: "\uD83D\uDCA1" }, comprehension: { name: "Reading Comprehension", icon: "\uD83D\uDCD6" },
  spelling: { name: "Spelling Patterns", icon: "\uD83D\uDD24" },
};

let state = { screen: "login", pinInput: "", error: "", loading: false, data: null };

function computeRecurringChallenges(units) {
  const byTopic = {};
  units.forEach((u) => {
    if (!u.test_times_taken) return;
    if (!byTopic[u.topic_id]) byTopic[u.topic_id] = { topicId: u.topic_id, attempted: 0, passed: 0, scoreSum: 0 };
    const t = byTopic[u.topic_id];
    t.attempted += 1;
    if (u.passed) t.passed += 1;
    t.scoreSum += Number(u.test_best) || 0;
  });
  return Object.values(byTopic).map((t) => ({ ...t, avgScore: t.scoreSum / t.attempted, passRate: t.passed / t.attempted }))
    .sort((a, b) => a.passRate - b.passRate || a.avgScore - b.avgScore);
}

async function tryLogin() {
  if (state.pinInput === ADMIN_PASSWORD) {
    state.screen = "dashboard";
    state.loading = true;
    state.data = null;
    render();
    try {
      const [students, units, topics] = await Promise.all([
        sbFetch("students?select=*&order=name.asc"),
        sbFetch("unit_progress?select=*"),
        sbFetch("topic_progress?select=*"),
      ]);
      state.data = { students, units, topics };
    } catch (e) {
      state.data = { error: e.message };
    }
    state.loading = false;
    render();
  } else {
    state.error = "Incorrect password";
    state.pinInput = "";
    render();
  }
}

function renderLogin() {
  return `
  <div style="padding-top:60px;text-align:center;">
    <div style="font-size:44px;margin-bottom:8px;">\uD83D\uDD12</div>
    <h1 class="display" style="font-size:22px;margin:0 0 6px;color:var(--gold);">Administrator Access</h1>
    <p style="opacity:.8;margin-bottom:22px;font-size:14px;">Learning Quest \u2014 Parent/Teacher Dashboard</p>
    <input id="pin-input" type="password" placeholder="Password" value="${escapeHtml(state.pinInput)}" style="width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--plum);background:var(--cream);color:var(--plum);font-size:16px;margin-bottom:14px;text-align:center;font-family:'Nunito',sans-serif;">
    ${state.error ? `<div style="color:var(--coral);font-size:13px;margin-bottom:14px;">${escapeHtml(state.error)}</div>` : ""}
    <button id="submit-btn" class="btn-primary">Enter</button>
    <p style="margin-top:24px;"><a href="./learning-quest.html" style="font-size:12px;opacity:.6;">\u2190 Back to Learning Quest</a></p>
  </div>`;
}

function renderDashboard() {
  if (state.loading) return `<div style="text-align:center;padding-top:60px;opacity:.75;">Loading progress from the cloud\u2026</div>`;
  const data = state.data;
  if (!data || data.error) {
    return `
    <div class="card" style="text-align:center;">
      <div style="font-size:30px;margin-bottom:10px;">\u26A0\uFE0F</div>
      <div class="display" style="font-size:15px;margin-bottom:8px;">Couldn't load cloud data</div>
      <div style="font-size:12px;opacity:.75;">${escapeHtml((data && data.error) || "Unknown error")}. Make sure the Supabase schema has been run and you're online.</div>
    </div>`;
  }
  const { students, units, topics } = data;
  const unitsByStudent = {}; units.forEach((u) => (unitsByStudent[u.student_id] = unitsByStudent[u.student_id] || []).push(u));
  const topicsByStudent = {}; topics.forEach((t) => (topicsByStudent[t.student_id] = topicsByStudent[t.student_id] || []).push(t));

  const rosterHtml = students.map((s) => {
    const sUnits = unitsByStudent[s.id] || [];
    const mastered = sUnits.filter((u) => u.passed).length;
    const sessionsPlayed = (topicsByStudent[s.id] || []).reduce((sum, t) => sum + (t.times_played || 0), 0);
    const weakest = sUnits.filter((u) => u.test_times_taken > 0).sort((a, b) => a.test_best - b.test_best)[0];
    return `
    <div class="card" style="margin-bottom:12px;">
      <div class="row gap-3" style="margin-bottom:6px;">
        <div style="font-size:26px;">${s.avatar || "\uD83E\uDDB8"}</div>
        <div style="flex:1;">
          <div class="display" style="font-size:15px;">${escapeHtml(s.name)}</div>
          <div style="font-size:11px;opacity:.65;">Grade ${s.grade || 3} \u00b7 ${mastered}/${sUnits.length || 0} units mastered \u00b7 ${sessionsPlayed} sessions played</div>
        </div>
      </div>
      ${weakest ? `<div style="font-size:12px;color:var(--coral);">Weakest: ${escapeHtml(TOPICS_BY_ID[weakest.topic_id] ? TOPICS_BY_ID[weakest.topic_id].name : weakest.topic_id)} (${Math.round(weakest.test_best * 100)}%)</div>` : `<div style="font-size:12px;opacity:.5;">No unit tests taken yet</div>`}
    </div>`;
  }).join("") || `<div style="text-align:center;opacity:.6;font-size:13px;padding:20px 0;">No students synced to the cloud yet.</div>`;

  const challenges = computeRecurringChallenges(units).slice(0, 5);
  const challengesHtml = challenges.length ? challenges.map((c) => {
    const topic = TOPICS_BY_ID[c.topicId];
    return `
    <div class="row between" style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);">
      <div style="font-size:13px;">${topic ? topic.icon : ""} ${escapeHtml(topic ? topic.name : c.topicId)}</div>
      <div style="text-align:right;">
        <div style="font-size:12px;font-weight:700;color:${c.passRate < 0.5 ? "var(--coral)" : "var(--gold)"};">${Math.round(c.passRate * 100)}% pass rate</div>
        <div style="font-size:10px;opacity:.6;">${c.attempted} attempted \u00b7 avg ${Math.round(c.avgScore * 100)}%</div>
      </div>
    </div>`;
  }).join("") : `<div style="text-align:center;opacity:.6;font-size:13px;padding:14px 0;">Not enough unit test data yet to spot patterns.</div>`;

  return `
    <div class="row between" style="margin-bottom:4px;">
      <h2 class="display" style="font-size:20px;color:var(--gold);">Admin Dashboard</h2>
      <button id="refresh-btn" class="link-btn">\u21BB Refresh</button>
    </div>
    <p style="font-size:12px;opacity:.7;margin-bottom:16px;">${students.length} student${students.length === 1 ? "" : "s"} synced to the cloud.</p>
    <h3 class="display" style="font-size:15px;margin-bottom:8px;color:var(--coral);">\uD83D\uDD25 Recurring Challenges</h3>
    <p style="font-size:11px;opacity:.65;margin-bottom:8px;">Units where the most students are struggling, across everyone tracked.</p>
    <div class="card" style="margin-bottom:20px;">${challengesHtml}</div>
    <h3 class="display" style="font-size:15px;margin-bottom:8px;">Students</h3>
    ${rosterHtml}
    <p style="margin-top:24px;text-align:center;"><a href="./learning-quest.html" style="font-size:12px;opacity:.6;">\u2190 Back to Learning Quest</a></p>
  `;
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = state.screen === "login" ? renderLogin() : renderDashboard();
  const pinInput = document.getElementById("pin-input");
  if (pinInput) {
    pinInput.addEventListener("input", (e) => { state.pinInput = e.target.value; });
    pinInput.addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin(); });
  }
  const submitBtn = document.getElementById("submit-btn");
  if (submitBtn) submitBtn.addEventListener("click", tryLogin);
  const refreshBtn = document.getElementById("refresh-btn");
  if (refreshBtn) refreshBtn.addEventListener("click", tryLogin);
}

render();
</script>
</body>
</html>
