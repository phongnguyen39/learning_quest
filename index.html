async function sbFetch(path, opts) {
  opts = opts || {};
  const headers = {
    apikey: SUPABASE_ANON_KEY,
    Authorization: "Bearer " + SUPABASE_ANON_KEY,
    "Content-Type": "application/json",
    ...(opts.headers || {}),
  };
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { ...opts, headers });
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`Supabase ${opts.method || "GET"} ${path} failed: ${res.status} ${text}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

// Fire-and-forget: local save always wins immediately, cloud sync happens in
// the background and silently no-ops if offline. Never blocks the UI.
function cloudSync(fn) {
  Promise.resolve().then(fn).catch((e) => console.warn("[cloud sync]", e.message));
}

  return sbFetch(`students?on_conflict=id`, {
    method: "POST",
    headers: { Prefer: "resolution=merge-duplicates" },
    body: JSON.stringify([{ id: student.id, name: student.name, avatar: student.avatar, grade: student.grade || 3 }]),
  });
}

/* ----------------------------- helpers ----------------------------- */

const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

function genUuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = (Math.random() * 16) | 0;
    const v = c === "x" ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}

const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

const buildOptions = (correct, candidates) => {
  const set = new Set(candidates.filter((n) => n !== correct && n >= 0));
  let arr = shuffle([...set]).slice(0, 3);
  let tries = 0;
  while (arr.length < 3 && tries < 30) {
    const w = correct + randInt(1, 9) * (Math.random() < 0.5 ? -1 : 1);
    if (w !== correct && w >= 0 && !arr.includes(w)) arr.push(w);
    tries++;
  }
  return shuffle([correct, ...arr].map(String));
};

const escapeHtml = (str) => String(str).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

function genMultiplication(grade) {
  if (grade === 5) {
    const a = randInt(11, 89);
    const b = randInt(11, 89);
    const correct = a * b;
    const candidates = [
      correct + a, correct - a, correct + b, correct - b,
      correct + 10, correct - 10, correct + 100, correct - 100,
    ];
    return { q: `${a} \u00D7 ${b} = ?`, options: buildOptions(correct, candidates), correct: String(correct), visual: { type: "areaMult", a, b } };
  }
  if (grade === 4) {
    const a = randInt(11, 89);
    const b = randInt(2, 9);
    const correct = a * b;
    const ones = a % 10;
    const candidates = [
      correct + b, correct - b, correct + 10 * b, correct - 10 * b,
      ones * b, correct + 1, correct - 1,
    ];
    return { q: `${a} \u00D7 ${b} = ?`, options: buildOptions(correct, candidates), correct: String(correct), visual: { type: "basetenMult", n: a, times: b } };
  }
  const a = randInt(2, 12);
  const b = randInt(2, 12);
  const correct = a * b;
  const candidates = [
    correct + a, correct - a, correct + b, correct - b,
    a * (b + 1), a * (b - 1), correct + 1, correct - 1, correct + 2, correct - 2,
  ];
  return { q: `${a} \u00D7 ${b} = ?`, options: buildOptions(correct, candidates), correct: String(correct), visual: { type: "array", rows: a, cols: b } };
}

function genDivision(grade) {
  if (grade === 5) {
    const divisor = randInt(4, 9);
    const quotient = randInt(15, 45);
    const remainder = randInt(1, divisor - 1);
    const dividend = divisor * quotient + remainder;
    const correct = `${quotient} R ${remainder}`;
    const wrongSet = new Set([
      `${quotient} R ${(remainder % (divisor - 1)) + 1}`,
      `${quotient - 1} R ${remainder}`,
      `${quotient + 1} R ${remainder}`,
      `${quotient} R ${Math.max(0, remainder - 1)}`,
    ]);
    wrongSet.delete(correct);
    let opts = shuffle([...wrongSet]).slice(0, 3);
    let tries = 0;
    while (opts.length < 3 && tries < 30) {
      const q2 = quotient + randInt(-3, 3);
      const r2 = randInt(0, divisor - 1);
      const cand = `${q2} R ${r2}`;
      if (q2 > 0 && cand !== correct && !opts.includes(cand)) opts.push(cand);
      tries++;
    }
    return { q: `${dividend} \u00F7 ${divisor} = ?`, options: shuffle([correct, ...opts]), correct, visual: { type: "divideBig", dividend, divisor } };
  }
  if (grade === 4) {
    const divisor = randInt(3, 9);
    const quotient = randInt(4, 12);
    const remainder = randInt(1, divisor - 1);
    const dividend = divisor * quotient + remainder;
    const correct = `${quotient} R ${remainder}`;
    const wrongSet = new Set([
      `${quotient} R ${(remainder % (divisor - 1)) + 1}`,
      `${quotient - 1} R ${remainder}`,
      `${quotient + 1} R ${remainder}`,
      `${quotient} R ${Math.max(0, remainder - 1)}`,
    ]);
    wrongSet.delete(correct);
    let opts = shuffle([...wrongSet]).slice(0, 3);
    let tries = 0;
    while (opts.length < 3 && tries < 30) {
      const q2 = quotient + randInt(-2, 2);
      const r2 = randInt(0, divisor - 1);
      const cand = `${q2} R ${r2}`;
      if (q2 > 0 && cand !== correct && !opts.includes(cand)) opts.push(cand);
      tries++;
    }
    return { q: `${dividend} \u00F7 ${divisor} = ?`, options: shuffle([correct, ...opts]), correct, visual: { type: "divide", dividend, divisor } };
  }
  const divisor = randInt(2, 12);
  const quotient = randInt(2, 12);
  const dividend = divisor * quotient;
  const correct = quotient;
  const candidates = [quotient + 1, quotient - 1, quotient + 2, quotient - 2, divisor, dividend - quotient];
  return { q: `${dividend} \u00F7 ${divisor} = ?`, options: buildOptions(correct, candidates), correct: String(correct), visual: { type: "divide", dividend, divisor } };
}

function genAddSub(grade) {
  const isAdd = Math.random() < 0.5;
  if (isAdd) {
    let a, b;
    if (grade === 5) {
      do {
        a = randInt(1005, 8995);
        b = randInt(1005, 8995);
      } while (a % 10 + b % 10 < 10);
    } else if (grade === 4) {
      do {
        a = randInt(105, 895);
        b = randInt(105, 895);
      } while (a % 10 + b % 10 < 10);
    } else {
      do {
        a = randInt(14, 89);
        b = randInt(14, 89);
      } while (a % 10 + b % 10 < 10);
    }
    const correct = a + b;
    const noCarry = Math.floor(a / 10) * 10 + Math.floor(b / 10) * 10 + ((a % 10 + b % 10) % 10);
    const candidates = [correct + 10, correct - 10, correct + 1, correct - 1, noCarry, correct + 100, correct - 100, correct + 1000, correct - 1000];
    const visual = grade === 5 ? { type: "numCards", a, b, op: "+" } : { type: "baseten2", a, b, op: "+" };
    return { q: `${a} + ${b} = ?`, options: buildOptions(correct, candidates), correct: String(correct), visual };
  } else {
    let a, b;
    if (grade === 5) {
      do {
        a = randInt(2000, 8999);
        b = randInt(1005, a - 500);
      } while (a % 10 >= b % 10);
    } else if (grade === 4) {
      do {
        a = randInt(200, 899);
        b = randInt(105, a - 50);
      } while (a % 10 >= b % 10);
    } else {
      do {
        a = randInt(30, 99);
        b = randInt(14, a - 1);
      } while (a % 10 >= b % 10);
    }
    const correct = a - b;
    const noBorrow = Math.abs(Math.floor(a / 10) * 10 - Math.floor(b / 10) * 10 + (a % 10 - b % 10));
    const candidates = [correct + 10, correct - 10, correct + 1, correct - 1, noBorrow, correct + 100, correct - 100, correct + 1000, correct - 1000];
    const visual = grade === 5 ? { type: "numCards", a, b, op: "\u2212" } : { type: "baseten2", a, b, op: "\u2212" };
    return { q: `${a} \u2212 ${b} = ?`, options: buildOptions(correct, candidates), correct: String(correct), visual };
  }
}

function getUnitProgress(topicId) {
  return (state.progress.units && state.progress.units[topicId]) || { practiceCount: 0, testBest: 0, testTimesTaken: 0, passed: false };
}

function isUnitUnlocked(curriculum, index) {
  if (index === 0) return true;
  return getUnitProgress(curriculum[index - 1].topicId).passed;
}

function buildUnitTestSession(topic, grade) {
  if (topic.generate) {
    return Array.from({ length: UNIT_TEST_SIZE }, () => topic.generate(grade));
  }
  const atGrade = topic.bank.filter((item) => (item.grade || 3) === grade);
  const below = topic.bank.filter((item) => (item.grade || 3) < grade);
  const pool = atGrade.length >= UNIT_TEST_SIZE ? atGrade : [...atGrade, ...below];
  const source = pool.length >= UNIT_TEST_SIZE ? pool : topic.bank;
  const picked = shuffle(source).slice(0, UNIT_TEST_SIZE);
  return picked.map((item) => ({ ...item, options: shuffle(item.options) }));
}

const buildTrailPath = (points) => {
  if (points.length === 0) return "";
  let d = `M ${points[0].x} ${points[0].y}`;
  for (let i = 1; i < points.length; i++) {
    const prev = points[i - 1];
    const curr = points[i];
    const midY = (prev.y + curr.y) / 2;
    d += ` C ${prev.x} ${midY}, ${curr.x} ${midY}, ${curr.x} ${curr.y}`;
  }
  return d;
};

function clockSvg(hour, minute) {
  const hourAngle = ((hour % 12) + minute / 60) * 30;
  const minuteAngle = minute * 6;
  const rad = (d) => (d * Math.PI) / 180;
  let ticks = "";
  for (let i = 0; i < 12; i++) {
    const a = rad(i * 30);
    const x1 = 60 + 50 * Math.sin(a), y1 = 60 - 50 * Math.cos(a);
    const x2 = 60 + 43 * Math.sin(a), y2 = 60 - 43 * Math.cos(a);
    ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2E2350" stroke-width="2"/>`;
  }
  const hx = 60 + 26 * Math.sin(rad(hourAngle)), hy = 60 - 26 * Math.cos(rad(hourAngle));
  const mx = 60 + 40 * Math.sin(rad(minuteAngle)), my = 60 - 40 * Math.cos(rad(minuteAngle));
  return `<svg viewBox="0 0 120 120" style="width:130px;height:130px;">
    <circle cx="60" cy="60" r="56" fill="#FBF3DD" stroke="#2E2350" stroke-width="4"/>
    ${ticks}
    <line x1="60" y1="60" x2="${hx}" y2="${hy}" stroke="#2E2350" stroke-width="5" stroke-linecap="round"/>
    <line x1="60" y1="60" x2="${mx}" y2="${my}" stroke="#FF6B5E" stroke-width="3" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="4" fill="#2E2350"/>
  </svg>`;
}

function placeValueVisualHtml(qText) {
  let matches = [...qText.matchAll(/\d{1,3}(?:,\d{3})+/g)].map((m) => m[0]);
  if (matches.length === 0) {
    matches = [...qText.matchAll(/\b\d{2,4}\b/g)].map((m) => m[0]);
  }
  matches = [...new Set(matches)].slice(0, 2);
  if (matches.length === 0) return "";

  let maskPlace = null;
  const m1 = qText.match(/what digit is in the (hundred[\s-]thousands|ten[\s-]thousands|thousands|hundreds|tens|ones) place/i);
  if (m1) maskPlace = m1[1].toLowerCase().replace(/\s/, "-");
  const m2 = qText.match(/how many (hundred[\s-]thousands|ten[\s-]thousands|thousands|hundreds|tens|ones) (?:are|is) in/i);
  if (m2) maskPlace = m2[1].toLowerCase().replace(/\s/, "-");

  const chartFor = (numStr) => {
    const digits = numStr.replace(/,/g, "").split("");
    const len = digits.length;
    const labels = ["Hundred-Thousands", "Ten-Thousands", "Thousands", "Hundreds", "Tens", "Ones"].slice(6 - len);
    let cols = "";
    for (let i = 0; i < len; i++) {
      const label = labels[i];
      const masked = maskPlace && label.toLowerCase() === maskPlace;
      cols += `<div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
        <div style="font-size:9px;opacity:.7;">${label}</div>
        <div style="width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;background:${masked ? "var(--gold)" : "var(--plum)"};color:${masked ? "var(--plum)" : "var(--cream)"};border:2px solid ${masked ? "var(--gold)" : "rgba(255,255,255,.15)"};">${masked ? "?" : digits[i]}</div>
      </div>`;
    }
    return `<div style="display:flex;gap:6px;justify-content:center;">${cols}</div>`;
  };
  return `<div style="display:flex;flex-direction:column;gap:10px;align-items:center;">${matches.map(chartFor).join("")}</div>`;
}

function fractionVisualHtml(qText) {
  const found = [...qText.matchAll(/\b(\d{1,2})\/(\d{1,2})\b/g)];
  const seen = new Set();
  const fracs = [];
  for (const m of found) {
    const n = parseInt(m[1], 10), d = parseInt(m[2], 10);
    if (d <= 0 || d > 12 || n < 0) continue;
    const key = `${n}/${d}`;
    if (seen.has(key)) continue;
    seen.add(key);
    fracs.push({ n, d });
    if (fracs.length >= 2) break;
  }
  if (fracs.length === 0) return "";
  const pie = ({ n, d }) => {
    const r = 32, cx = 38, cy = 38;
    let slices = "";
    for (let i = 0; i < d; i++) {
      const a0 = (i / d) * 2 * Math.PI - Math.PI / 2;
      const a1 = ((i + 1) / d) * 2 * Math.PI - Math.PI / 2;
      const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
      const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      const filled = i < n;
      slices += `<path d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1} Z" fill="${filled ? "var(--coral)" : "var(--cream)"}" stroke="var(--plum)" stroke-width="1.5"/>`;
    }
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
      <svg viewBox="0 0 76 76" style="width:76px;height:76px;">${slices}</svg>
      <div style="font-size:12px;opacity:.8;">${n}/${d}</div>
    </div>`;
  };
  return `<div style="display:flex;gap:16px;justify-content:center;">${fracs.map(pie).join("")}</div>`;
}

function divideBigVisualHtml(dividend, divisor) {
  return `<div style="display:flex;align-items:center;justify-content:center;gap:14px;">
    ${baseTenBlockHtml(dividend)}
    <div class="display" style="font-size:22px;opacity:.8;">\u00F7${divisor}</div>
  </div>`;
}

function numCardsVisualHtml(a, b, op) {
  const card = (n) => `<div style="background:var(--plum);border:2px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 16px;font-size:20px;font-weight:700;color:var(--cream);">${n.toLocaleString()}</div>`;
  return `<div style="display:flex;align-items:center;justify-content:center;gap:14px;">${card(a)}<div class="display" style="font-size:22px;opacity:.8;">${op}</div>${card(b)}</div>`;
}

function measurementVisualHtml(qText) {
  const shapeMap = { triangle: 3, square: 4, rectangle: 4, pentagon: 5, hexagon: 6 };
  const shapeMatch = Object.keys(shapeMap).find((s) => new RegExp(`\\b${s}\\b`, "i").test(qText));
  if (shapeMatch && /how many sides/i.test(qText)) {
    return polygonVisualHtml(shapeMap[shapeMatch]);
  }
  let m = qText.match(/length of (\d+(?:\.\d+)?)\s*(\w+)[^.]*width of (\d+(?:\.\d+)?)\s*(\w+)/i);
  if (m) return labeledRectVisualHtml(parseFloat(m[1]), parseFloat(m[3]), m[2]);
  m = qText.match(/square[^.]*(\d+(?:\.\d+)?)\s*(\w+)\s*long/i);
  if (m) return labeledRectVisualHtml(parseFloat(m[1]), parseFloat(m[1]), m[2]);
  m = qText.match(/rectangle is (\d+(?:\.\d+)?)\s*(\w+)\s*long and (\d+(?:\.\d+)?)\s*(\w+)\s*wide/i);
  if (m) return labeledRectVisualHtml(parseFloat(m[1]), parseFloat(m[3]), m[2]);
  if (/pencil/i.test(qText)) return emojiVisualHtml("\u270F\uFE0F");
  if (/watermelon/i.test(qText)) return emojiVisualHtml("\uD83C\uDF49");
  if (/bathtub|water/i.test(qText)) return emojiVisualHtml("\uD83D\uDED1");
  if (/feather/i.test(qText)) return emojiVisualHtml("\uD83E\uDEB6");
  return "";
}

function timeVisualHtml(q) {
  if (q.clock) return clockSvg(q.clock.hour, q.clock.minute);
  const m = q.q.match(/\b(\d{1,2}):(\d{2})\b/);
  if (m) return clockSvg(parseInt(m[1], 10), parseInt(m[2], 10));
  return "";
}

function questionVisualHtml(q, topicId) {
  if (q.visual) {
    const v = q.visual;
    if (v.type === "array") return arrayVisualHtml(v.rows, v.cols);
    if (v.type === "divide") return divideVisualHtml(v.dividend, v.divisor);
    if (v.type === "baseten2") return baseTen2VisualHtml(v.a, v.b, v.op);
    if (v.type === "basetenMult") return `<div style="display:flex;align-items:center;justify-content:center;gap:14px;">${baseTenBlockHtml(v.n)}<div class="display" style="font-size:22px;opacity:.8;">\u00D7${v.times}</div></div>`;
    if (v.type === "areaMult") return areaMultVisualHtml(v.a, v.b);
    if (v.type === "divideBig") return divideBigVisualHtml(v.dividend, v.divisor);
    if (v.type === "numCards") return numCardsVisualHtml(v.a, v.b, v.op);
  }
  if (q.icon) return emojiVisualHtml(q.icon);
  if (topicId === "placevalue") return placeValueVisualHtml(q.q);
  if (topicId === "fractions") return fractionVisualHtml(q.q);
  if (topicId === "money") return moneyVisualHtml(q.q);
  if (topicId === "measurement") return measurementVisualHtml(q.q);
  if (topicId === "time") return timeVisualHtml(q);
  return "";
}

function starRowHtml(filled, size) {
  size = size || 16;
  let s = "";
  for (let i = 0; i < 3; i++) {
    s += `<span style="font-size:${size}px;color:${i < filled ? "var(--gold)" : "rgba(255,255,255,.3)"};">${i < filled ? "\u2605" : "\u2606"}</span>`;
  }
  return `<div style="display:flex;gap:2px;">${s}</div>`;
}

// session counts toward that unit's recommended practice days.
function startPractice(topicId) {

}

// A longer, higher-stakes cumulative test for one unit. Passing unlocks the
// next unit in the sequence (mastery-based gating).
function startUnitTest(topicId) {
  const topic = TOPICS_BY_ID[topicId];
  state.activeTopic = topic;
  state.unitTestMode = true;
  state.fromLearningPath = false;
  state.quizQuestions = buildUnitTestSession(topic, state.grade);
  state.qIndex = 0;
  state.selectedOption = null;
  state.showFeedback = false;
  state.sessionCorrect = 0;
  state.streak = 0;
  state.sessionStreakMax = 0;
  state.screen = "quiz";
  render();
}

function selectOption(opt) {
  if (state.showFeedback) return;
  const q = state.quizQuestions[state.qIndex];
  state.selectedOption = opt;
  state.showFeedback = true;
  if (opt === q.correct) {
    state.sessionCorrect++;
    state.streak++;
    state.sessionStreakMax = Math.max(state.sessionStreakMax, state.streak);
  } else {
    state.streak = 0;
  }
  render();
}

function nextQuestion() {
  if (state.qIndex + 1 < state.quizQuestions.length) {
    state.qIndex++;
    state.selectedOption = null;
    state.showFeedback = false;
    render();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  const total = state.quizQuestions.length;
  const percent = state.sessionCorrect / total;
  const ratingStars = percent >= 0.8 ? 3 : percent >= 0.5 ? 2 : 1;
  const streakBonus = state.sessionStreakMax >= 3 ? (state.sessionStreakMax - 2) * 5 : 0;
  const starsEarned = state.sessionCorrect * 10 + streakBonus + (state.unitTestMode ? 20 : 0);

  const prevTopic = state.progress.topics[state.activeTopic.id] || { timesPlayed: 0, bestPercent: 0 };
  const nextTopics = {
    ...state.progress.topics,
    [state.activeTopic.id]: {
      timesPlayed: prevTopic.timesPlayed + 1,
      bestPercent: Math.max(prevTopic.bestPercent, percent),
    },
  };

  let nextUnits = state.progress.units || {};
  let unitJustPassed = false;
  if (state.unitTestMode) {
    const prevUnit = getUnitProgress(state.activeTopic.id);
    const passedNow = percent >= UNIT_PASS_THRESHOLD;
    unitJustPassed = passedNow && !prevUnit.passed;
    nextUnits = {
      ...nextUnits,
      [state.activeTopic.id]: {
        practiceCount: prevUnit.practiceCount,
        testBest: Math.max(prevUnit.testBest, percent),
        testTimesTaken: prevUnit.testTimesTaken + 1,
        passed: prevUnit.passed || passedNow,
      },
    };
  } else if (state.fromLearningPath) {
    const prevUnit = getUnitProgress(state.activeTopic.id);
    nextUnits = {
      ...nextUnits,
      [state.activeTopic.id]: { ...prevUnit, practiceCount: prevUnit.practiceCount + 1 },
    };
  }

  const nextBase = {
    totalStars: state.progress.totalStars + starsEarned,
    topics: nextTopics,
    units: nextUnits,
    bestStreak: Math.max(state.progress.bestStreak, state.sessionStreakMax),
    badges: state.progress.badges,
  };
  const newBadgeIds = BADGES.filter((b) => !state.progress.badges.includes(b.id) && b.check(nextBase)).map((b) => b.id);
  state.progress = { ...nextBase, badges: [...state.progress.badges, ...newBadgeIds] };
  saveProgressForStudent(state.profile.id, state.progress);
  const syncStudentId = state.profile.id, syncTopicId = state.activeTopic.id, syncSubject = state.activeTopic.subject;
  const syncSessionType = state.unitTestMode ? "unit_test" : "practice";
  const syncPercent = state.sessionCorrect / total;
  cloudSync(() => Promise.all([
    upsertTopicProgressCloud(syncStudentId, syncTopicId, nextTopics[syncTopicId]),
    state.unitTestMode || state.fromLearningPath ? upsertUnitProgressCloud(syncStudentId, syncTopicId, syncSubject, nextUnits[syncTopicId]) : Promise.resolve(),
    logSessionCloud(syncStudentId, syncTopicId, syncSubject, syncSessionType, state.sessionCorrect, total, syncPercent),
  ]));
  state.lastResult = {
    starsEarned, correct: state.sessionCorrect, total, ratingStars,
    newBadges: BADGES.filter((b) => newBadgeIds.includes(b.id)),
    isUnitTest: state.unitTestMode,
    unitPassed: state.unitTestMode ? nextUnits[state.activeTopic.id].passed : null,
    unitJustPassed,
    fromLearningPath: state.fromLearningPath,
  };
  state.screen = "results";
  render();
}

function resetProgress() {
  if (!confirm("This will erase all stars, badges, and quest progress. Continue?")) return;
  state.progress = { totalStars: 0, topics: {}, units: {}, badges: [], bestStreak: 0 };
  saveProgressForStudent(state.profile.id, state.progress);

}

// Aggregates unit_progress ACROSS students, grouped by topic/unit, to surface
// which curriculum units are broadly hard rather than just one kid's weak spot.
function computeRecurringChallenges(units) {
  const byTopic = {};
  units.forEach((u) => {
    if (!u.test_times_taken) return; // only consider units that have actually been tested
    if (!byTopic[u.topic_id]) byTopic[u.topic_id] = { topicId: u.topic_id, subject: u.subject, attempted: 0, passed: 0, scoreSum: 0, needingRetries: 0 };
    const t = byTopic[u.topic_id];
    t.attempted += 1;
    if (u.passed) t.passed += 1;
    t.scoreSum += Number(u.test_best) || 0;
    if (u.test_times_taken >= 2 && !u.passed) t.needingRetries += 1;
  });
  return Object.values(byTopic).map((t) => ({
    ...t,
    avgScore: t.scoreSum / t.attempted,
    passRate: t.attempted > 0 ? t.passed / t.attempted : 0,
  })).sort((a, b) => a.passRate - b.passRate || a.avgScore - b.avgScore);
}

function buildProgressReportText() {
  const p = state.progress;
  const name = state.profile ? state.profile.name : "Explorer";
  const level = Math.floor(p.totalStars / 100) + 1;
  const lines = [];
  lines.push(`Learning Quest Progress Report for ${name}`);
  lines.push("");
  lines.push(`Level: ${level}  |  Total stars: ${p.totalStars}  |  Best streak: ${p.bestStreak}`);
  lines.push(`Current difficulty: ${GRADE_LABELS[state.grade] || "3rd grade (Easy)"}`);
  lines.push("");

  const section = (title, topics) => {
    const played = topics.filter((t) => p.topics[t.id]);
    lines.push(`${title}:`);
    if (played.length === 0) {
      lines.push("  No lessons completed yet.");
    } else {
      played.forEach((t) => {
        const s = p.topics[t.id];
        lines.push(`  - ${t.name}: played ${s.timesPlayed}x, best score ${Math.round(s.bestPercent * 100)}%`);
      });
    }
    lines.push("");
  };

  section("MATH", MATH_TOPICS);
  section("READING & WRITING", READING_TOPICS);

  if (p.badges.length > 0) {
    const badgeNames = p.badges.map((id) => { const b = BADGES.find((x) => x.id === id); return b ? `${b.icon} ${b.name}` : id; });
    lines.push(`Badges earned (${p.badges.length}): ${badgeNames.join(", ")}`);
  } else {
    lines.push("Badges earned: none yet.");
  }
  lines.push("");
  lines.push(`Sent from Learning Quest on ${new Date().toLocaleDateString()}`);
  return lines.join("\n");
}

function renderTrail(subject) {
  const topics = subject === "math" ? MATH_TOPICS : READING_TOPICS;
  const title = subject === "math" ? "Number Realm" : "Word Realm";
  const trailColor = subject === "math" ? "#FF6B5E" : "#3DDC97";
  const VIEWBOX_W = 320;
  const height = 70 + topics.length * 148;
  const points = topics.map((t, i) => {
    const pos = getNodePos(i);
    return { x: (pos.xPct / 100) * VIEWBOX_W, y: pos.y };
  });
  const pathD = buildTrailPath(points);
  const nodesHtml = topics.map((topic, i) => {
    const pos = getNodePos(i);
    const stats = state.progress.topics[topic.id];
    const rating = stats ? (stats.bestPercent >= 0.8 ? 3 : stats.bestPercent >= 0.5 ? 2 : 1) : 0;
    return `
    <button data-action="start-quiz" data-topic="${topic.id}" style="position:absolute;left:${pos.xPct}%;top:${pos.y}px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:96px;border:none;background:none;cursor:pointer;">
      <div style="width:64px;height:64px;border-radius:50%;background:${topic.color};display:flex;align-items:center;justify-content:center;border:3px solid var(--cream);box-shadow:0 4px 10px rgba(0,0,0,.35);font-size:28px;">${topic.icon}</div>
      <div style="font-size:12px;text-align:center;line-height:1.2;color:var(--cream);">${topic.name}</div>
      ${starRowHtml(rating, 13)}
    </button>`;
  }).join("");
  return `
    ${topBarHtml({ showBack: true, backAction: "go-home" })}
    <h2 class="display" style="font-size:20px;margin-bottom:16px;color:${trailColor};">${title}</h2>
    <div style="position:relative;height:${height}px;">
      <svg viewBox="0 0 ${VIEWBOX_W} ${height}" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;">
        <path d="${pathD}" fill="none" stroke="${trailColor}" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.45"/>
      </svg>
      ${nodesHtml}
    </div>
  `;
}

function renderLearningPath(subject) {
  const curriculum = CURRICULUM_BY_SUBJECT[subject];
  const title = subject === "math" ? "Number Realm Learning Path" : "Word Realm Learning Path";
  const accent = subject === "math" ? "#FF6B5E" : "#3DDC97";

  const cardsHtml = curriculum.map((unit, i) => {
    const topic = TOPICS_BY_ID[unit.topicId];
    const unlocked = isUnitUnlocked(curriculum, i);
    const up = getUnitProgress(unit.topicId);
    const video = MODULE_INTRO_VIDEOS[unit.topicId];
    const statusLabel = !unlocked ? "Locked" : up.passed ? "Mastered" : up.testTimesTaken > 0 ? "Retake needed" : "In progress";
    const statusColor = !unlocked ? "rgba(255,255,255,.4)" : up.passed ? "var(--green)" : up.testTimesTaken > 0 ? "var(--coral)" : "var(--gold)";

    const dayChecklist = unlocked ? `
      <div style="display:flex;gap:6px;margin:10px 0;">
        <div title="Watch intro video" style="flex:1;height:6px;border-radius:999px;background:${video ? accent : "rgba(255,255,255,.15)"};opacity:.9;"></div>
        ${[1, 2].map((d) => `<div title="Practice day ${d}" style="flex:1;height:6px;border-radius:999px;background:${up.practiceCount >= d ? accent : "rgba(255,255,255,.15)"};"></div>`).join("")}
        <div title="Review" style="flex:1;height:6px;border-radius:999px;background:${up.practiceCount >= PRACTICE_DAYS_RECOMMENDED ? accent : "rgba(255,255,255,.15)"};"></div>
        <div title="Unit test" style="flex:1;height:6px;border-radius:999px;background:${up.passed ? "var(--green)" : "rgba(255,255,255,.15)"};"></div>
      </div>` : "";

    const actionsHtml = !unlocked ? `
      <div style="font-size:12px;opacity:.6;margin-top:8px;">\uD83D\uDD12 Pass the Week ${unit.week - 1} unit test to unlock</div>
    ` : `
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">
        ${video ? `<a href="${video.url}" target="_blank" rel="noopener" style="font-size:12px;text-decoration:none;color:var(--cream);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:8px 12px;">\uD83D\uDCFA Watch: ${escapeHtml(video.title)}</a>` : ""}
        <button data-action="start-practice" data-topic="${unit.topicId}" style="font-size:12px;color:var(--cream);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:8px 12px;cursor:pointer;">\uD83D\uDCDD Practice (${up.practiceCount} done)</button>
        <button data-action="start-unit-test" data-topic="${unit.topicId}" style="font-size:12px;color:var(--plum);background:${accent};border:none;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700;">${up.passed ? "\u2705 Retake Unit Test" : "\uD83C\uDFAF Take Unit Test"}</button>
      </div>
      ${up.testTimesTaken > 0 ? `<div style="font-size:11px;opacity:.65;margin-top:6px;">Best test score: ${Math.round(up.testBest * 100)}% (need ${Math.round(UNIT_PASS_THRESHOLD * 100)}% to pass)</div>` : ""}
    `;

    return `
    <div class="card" style="margin-bottom:14px;opacity:${unlocked ? 1 : 0.55};">
      <div class="row between" style="margin-bottom:4px;">
        <div style="font-size:11px;opacity:.65;">WEEK ${unit.week}</div>
        <div style="font-size:11px;font-weight:700;color:${statusColor};">${unlocked ? "" : "\uD83D\uDD12 "}${statusLabel}</div>
      </div>
      <div class="row gap-3">
        <div style="width:44px;height:44px;border-radius:12px;background:${topic.color};display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;">${topic.icon}</div>
        <div class="display" style="font-size:16px;">${topic.name}</div>
      </div>
      ${dayChecklist}
      ${actionsHtml}
    </div>`;
  }).join("");

  return `
    ${topBarHtml({ showBack: true, backAction: "go-home" })}
    <h2 class="display" style="font-size:20px;margin-bottom:4px;color:${accent};">${title}</h2>
    <p style="font-size:12px;opacity:.7;margin-bottom:18px;">A guided week-by-week program \u2014 watch, practice, then pass the unit test to move on.</p>
    ${cardsHtml}
    <button data-action="go-progress-report-${subject}" class="btn-secondary" style="margin-top:8px;">\uD83D\uDCCA View Progress Report</button>
  `;
}

function renderProgressReport(subject) {
  const curriculum = CURRICULUM_BY_SUBJECT[subject];
  const title = subject === "math" ? "Number Realm Progress Report" : "Word Realm Progress Report";
  const accent = subject === "math" ? "#FF6B5E" : "#3DDC97";
  const masteredCount = curriculum.filter((u) => getUnitProgress(u.topicId).passed).length;
  const weakSpots = curriculum
    .map((u) => ({ u, up: getUnitProgress(u.topicId) }))
    .filter(({ up }) => up.testTimesTaken > 0 && up.testBest < UNIT_PASS_THRESHOLD)
    .map(({ u }) => TOPICS_BY_ID[u.topicId].name);

  const rowsHtml = curriculum.map((unit) => {
    const topic = TOPICS_BY_ID[unit.topicId];
    const up = getUnitProgress(unit.topicId);
    const scoreLabel = up.testTimesTaken > 0 ? `${Math.round(up.testBest * 100)}%` : "\u2014";
    const dot = up.passed ? "var(--green)" : up.testTimesTaken > 0 ? "var(--coral)" : "rgba(255,255,255,.3)";
    return `
    <div class="row between" style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);">
      <div class="row gap-2"><span style="width:9px;height:9px;border-radius:50%;background:${dot};display:inline-block;"></span><span style="font-size:13px;">Wk ${unit.week} \u00b7 ${topic.name}</span></div>
      <div style="font-size:13px;font-weight:700;">${scoreLabel}</div>
    </div>`;
  }).join("");

  return `
    ${topBarHtml({ showBack: true, backAction: `go-learning-path-${subject}` })}
    <h2 class="display" style="font-size:20px;margin-bottom:4px;color:${accent};">${title}</h2>
    <p style="font-size:12px;opacity:.7;margin-bottom:16px;">${masteredCount}/${curriculum.length} units mastered</p>
    <div class="card" style="margin-bottom:16px;">${rowsHtml}</div>
    ${weakSpots.length ? `<div class="card" style="margin-bottom:16px;border:2px solid var(--coral);"><div class="display" style="font-size:13px;color:var(--coral);margin-bottom:6px;">Needs review</div><div style="font-size:12px;opacity:.85;">${weakSpots.map(escapeHtml).join(", ")}</div></div>` : ""}
    <button data-action="email-report" class="btn-secondary">\uD83D\uDCE7 Email this report</button>
  `;
}

function renderAdminDashboard() {
  if (state.adminLoading) {
    return `
    ${topBarHtml({ showBack: true, backAction: "go-roster" })}
    <div style="text-align:center;padding-top:60px;opacity:.75;">Loading progress from the cloud\u2026</div>`;
  }
  const data = state.adminData;
  if (!data || data.error) {
    return `
    ${topBarHtml({ showBack: true, backAction: "go-roster" })}
    <div class="card" style="text-align:center;">
      <div style="font-size:30px;margin-bottom:10px;">\u26A0\uFE0F</div>
      <div class="display" style="font-size:15px;margin-bottom:8px;">Couldn't load cloud data</div>
      <div style="font-size:12px;opacity:.75;margin-bottom:16px;">${escapeHtml((data && data.error) || "Unknown error")}. Make sure the Supabase schema has been run (see supabase-schema.sql) and you're online.</div>
      <button data-action="admin-refresh" class="btn-secondary">Try Again</button>
    </div>`;
  }

  const { students, units, topics } = data;
  const unitsByStudent = {};
  units.forEach((u) => { (unitsByStudent[u.student_id] = unitsByStudent[u.student_id] || []).push(u); });
  const topicsByStudent = {};
  topics.forEach((t) => { (topicsByStudent[t.student_id] = topicsByStudent[t.student_id] || []).push(t); });

  const rosterHtml = students.map((s) => {
    const sUnits = unitsByStudent[s.id] || [];
    const mastered = sUnits.filter((u) => u.passed).length;
    const sessionsPlayed = (topicsByStudent[s.id] || []).reduce((sum, t) => sum + (t.times_played || 0), 0);
    const weakest = sUnits.filter((u) => u.test_times_taken > 0).sort((a, b) => a.test_best - b.test_best)[0];
    return `
    <div class="card" style="margin-bottom:12px;">
      <div class="row gap-3" style="margin-bottom:6px;">
        <div style="font-size:26px;">${s.avatar || "\uD83E\uDDB8"}</div>
        <div style="flex:1;">
          <div class="display" style="font-size:15px;">${escapeHtml(s.name)}</div>
          <div style="font-size:11px;opacity:.65;">Grade ${s.grade || 3} \u00b7 ${mastered}/${sUnits.length || 0} units mastered \u00b7 ${sessionsPlayed} sessions played</div>
        </div>
      </div>
      ${weakest ? `<div style="font-size:12px;color:var(--coral);">Weakest: ${escapeHtml(TOPICS_BY_ID[weakest.topic_id] ? TOPICS_BY_ID[weakest.topic_id].name : weakest.topic_id)} (${Math.round(weakest.test_best * 100)}%)</div>` : `<div style="font-size:12px;opacity:.5;">No unit tests taken yet</div>`}
    </div>`;
  }).join("") || `<div style="text-align:center;opacity:.6;font-size:13px;padding:20px 0;">No students synced to the cloud yet.</div>`;

  const challenges = computeRecurringChallenges(units).slice(0, 5);
  const challengesHtml = challenges.length ? challenges.map((c) => {
    const topic = TOPICS_BY_ID[c.topicId];
    return `
    <div class="row between" style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);">
      <div style="font-size:13px;">${topic ? topic.icon : ""} ${escapeHtml(topic ? topic.name : c.topicId)}</div>
      <div style="text-align:right;">
        <div style="font-size:12px;font-weight:700;color:${c.passRate < 0.5 ? "var(--coral)" : "var(--gold)"};">${Math.round(c.passRate * 100)}% pass rate</div>
        <div style="font-size:10px;opacity:.6;">${c.attempted} attempted \u00b7 avg ${Math.round(c.avgScore * 100)}%</div>
      </div>
    </div>`;
  }).join("") : `<div style="text-align:center;opacity:.6;font-size:13px;padding:14px 0;">Not enough unit test data yet to spot patterns.</div>`;

  return `
    ${topBarHtml({ showBack: true, backAction: "go-roster" })}
    <div class="row between" style="margin-bottom:4px;">
      <h2 class="display" style="font-size:20px;color:var(--gold);">Admin Dashboard</h2>
      <button data-action="admin-refresh" class="link-btn">\u21BB Refresh</button>
    </div>
    <p style="font-size:12px;opacity:.7;margin-bottom:16px;">${students.length} student${students.length === 1 ? "" : "s"} synced to the cloud.</p>

    <h3 class="display" style="font-size:15px;margin-bottom:8px;color:var(--coral);">\uD83D\uDD25 Recurring Challenges</h3>
    <p style="font-size:11px;opacity:.65;margin-bottom:8px;">Units where the most students are struggling, across everyone tracked.</p>
    <div class="card" style="margin-bottom:20px;">${challengesHtml}</div>

    <h3 class="display" style="font-size:15px;margin-bottom:8px;">Students</h3>
    ${rosterHtml}
  `;
}

function renderQuiz() {
  const q = state.quizQuestions[state.qIndex];
  if (!q) return "";
  const longOptions = q.options.some((o) => o.length > 22);
  const optsHtml = q.options.map((opt) => {
    let bg = "rgba(255,255,255,.06)", border = "2px solid rgba(255,255,255,.15)", mark = "";
    if (state.showFeedback) {
      if (opt === q.correct) {
        bg = "rgba(61,220,151,.25)"; border = "2px solid var(--green)";
        mark = '<span style="color:var(--green);margin-right:6px;">\u2713</span>';
      } else if (opt === state.selectedOption) {
        bg = "rgba(255,107,94,.25)"; border = "2px solid var(--coral)";
        mark = '<span style="color:var(--coral);margin-right:6px;">\u2715</span>';
      }
    }
    return `<button data-action="select-option" data-value="${escapeHtml(opt)}" ${state.showFeedback ? "disabled" : ""} style="padding:14px 12px;border-radius:14px;border:${border};background:${bg};color:var(--cream);font-size:15px;cursor:${state.showFeedback ? "default" : "pointer"};display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:56px;">${mark}${escapeHtml(opt)}</button>`;
  }).join("");

  const video = TOPIC_VIDEOS[state.activeTopic.id];
  const videoLinkHtml = (state.showFeedback && state.selectedOption !== q.correct && video) ? `
    <a href="${video.url}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;background:var(--plum);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 14px;margin-bottom:14px;text-decoration:none;color:var(--cream);font-size:13px;">
      <span style="font-size:18px;">\uD83D\uDCFA</span>
      <span style="text-align:left;">Need a refresher? Watch <strong>${escapeHtml(video.title)}</strong> (${escapeHtml(video.channel)})</span>
    </a>` : "";

  const feedbackHtml = state.showFeedback ? `
    <div class="pop" style="margin-top:18px;text-align:center;">
      <div class="display" style="font-size:16px;color:${state.selectedOption === q.correct ? "var(--green)" : "var(--coral)"};margin-bottom:4px;">
        ${state.selectedOption === q.correct ? "Nice work!" : `Not quite \u2014 it's ${escapeHtml(q.correct)}`}
      </div>
      ${q.explain ? `<div style="font-size:13px;opacity:.8;margin-bottom:12px;">${escapeHtml(q.explain)}</div>` : ""}
      <div>${videoLinkHtml}</div>
      <button data-action="next-question" class="btn-primary">${state.qIndex + 1 < state.quizQuestions.length ? "Next Question" : "See Results"}</button>
    </div>` : "";

  return `
    <div class="row between" style="margin-bottom:14px;">
      <div class="row gap-2">
        <button data-action="exit-quiz" class="icon-btn" aria-label="Exit quest">\u2190</button>
        <button data-action="go-home" class="icon-btn" aria-label="Home">\uD83C\uDFE0</button>
      </div>
      <div class="display" style="font-size:14px;">${state.activeTopic.name}</div>
      <div style="font-size:13px;opacity:.75;">${state.qIndex + 1}/${state.quizQuestions.length}</div>
    </div>
    <div style="height:8px;border-radius:999px;background:var(--plum);margin-bottom:18px;overflow:hidden;">
      <div style="height:100%;width:${(state.qIndex / state.quizQuestions.length) * 100}%;background:${state.activeTopic.color};border-radius:999px;transition:width .3s;"></div>
    </div>
    ${state.streak >= 2 ? `<div class="row center gap-2" style="margin-bottom:10px;color:var(--gold);font-size:13px;">\uD83D\uDD25 ${state.streak} in a row!</div>` : ""}
    <div class="card" style="margin-bottom:18px;">
      ${q.passage ? `<div style="background:var(--cream);color:var(--plum);border-radius:14px;padding:14px;margin-bottom:16px;font-size:14px;line-height:1.5;">${escapeHtml(q.passage)}</div>` : ""}
      ${(() => { const vis = questionVisualHtml(q, state.activeTopic.id); return vis ? `<div style="display:flex;justify-content:center;margin-bottom:16px;">${vis}</div>` : ""; })()}
      <div class="display" style="font-size:18px;text-align:center;line-height:1.4;">${escapeHtml(q.q)}</div>
    </div>
    <div class="pop" style="display:grid;grid-template-columns:${longOptions ? "1fr" : "1fr 1fr"};gap:10px;">${optsHtml}</div>
    ${feedbackHtml}
  `;
}

function renderResults() {
  const r = state.lastResult;
  if (!r) return "";
  const starsHtml = [0, 1, 2].map((i) => `<span class="${i < r.ratingStars ? "twinkle" : ""}" style="font-size:44px;color:var(--gold);">${i < r.ratingStars ? "\u2605" : "\u2606"}</span>`).join("");
  const badgesHtml = r.newBadges.length ? `
    <div style="margin-bottom:24px;">
      <div class="display" style="font-size:14px;color:var(--gold);margin-bottom:10px;">New badge unlocked!</div>
      ${r.newBadges.map((b) => `
        <div class="pop row gap-3" style="background:var(--plum);border:2px solid var(--gold);border-radius:16px;padding:14px;margin-bottom:8px;text-align:left;">
          <span style="font-size:28px;">${b.icon}</span>
          <div><div class="display" style="font-size:14px;">${b.name}</div><div style="font-size:12px;opacity:.75;">${b.desc}</div></div>
        </div>`).join("")}
    </div>` : "";
  const recapVideo = TOPIC_VIDEOS[state.activeTopic.id];
  const recapHtml = (r.correct < r.total && recapVideo) ? `
    <a href="${recapVideo.url}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;background:var(--plum);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:12px 14px;margin-bottom:20px;text-decoration:none;color:var(--cream);text-align:left;">
      <span style="font-size:22px;">\uD83D\uDCFA</span>
      <div>
        <div style="font-size:11px;opacity:.7;">Want more practice with ${escapeHtml(state.activeTopic.name)}?</div>
        <div style="font-size:13px;font-weight:700;">${escapeHtml(recapVideo.title)} <span style="opacity:.7;font-weight:400;">\u2014 ${escapeHtml(recapVideo.channel)}</span></div>
      </div>
    </a>` : "";

  const unitBannerHtml = r.isUnitTest ? `
    <div class="pop" style="margin-bottom:20px;padding:14px;border-radius:14px;background:${r.unitPassed ? "rgba(61,220,151,.15)" : "rgba(255,107,94,.15)"};border:2px solid ${r.unitPassed ? "var(--green)" : "var(--coral)"};">
      <div class="display" style="font-size:16px;color:${r.unitPassed ? "var(--green)" : "var(--coral)"};">
        ${r.unitPassed ? (r.unitJustPassed ? "\u2705 Unit Test Passed \u2014 next unit unlocked!" : "\u2705 Unit already mastered") : `Not yet \u2014 need ${Math.round(UNIT_PASS_THRESHOLD * 100)}% to pass`}
      </div>
    </div>` : "";

  const backAction = (r.isUnitTest || r.fromLearningPath)
    ? `go-learning-path-${state.activeTopic.subject}`
    : "back-to-map";
  const playAgainAction = r.isUnitTest ? "retry-unit-test" : "play-again";

  return `
    <div style="text-align:left;margin-bottom:6px;">
      <button data-action="go-home" class="icon-btn" aria-label="Home">\uD83C\uDFE0</button>
    </div>
    <div style="text-align:center;padding-top:10px;">
      <div class="pop row center gap-2" style="margin-bottom:16px;">${starsHtml}</div>
      <h2 class="display" style="font-size:24px;margin-bottom:6px;">${r.correct}/${r.total} correct!</h2>
      <p style="opacity:.85;margin-bottom:22px;">+${r.starsEarned} stars earned</p>
      ${unitBannerHtml}
      ${badgesHtml}
      ${recapHtml}
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button data-action="${playAgainAction}" class="btn-primary">${r.isUnitTest ? "Retake Unit Test" : "Play Again"}</button>
        <button data-action="${backAction}" class="btn-secondary">${(r.isUnitTest || r.fromLearningPath) ? "Back to Learning Path" : "Back to Map"}</button>
      </div>
    </div>`;
}

function renderBadges() {
  const itemsHtml = BADGES.map((b) => {
    const unlocked = state.progress.badges.includes(b.id);
    return `<div style="background:${unlocked ? "var(--plum)" : "rgba(255,255,255,.04)"};border:2px solid ${unlocked ? "var(--gold)" : "rgba(255,255,255,.1)"};border-radius:16px;padding:14px;text-align:center;">
      <div style="font-size:30px;margin-bottom:8px;">${unlocked ? b.icon : "\uD83D\uDD12"}</div>
      <div class="display" style="font-size:13px;margin-bottom:4px;opacity:${unlocked ? 1 : 0.5};">${b.name}</div>
      <div style="font-size:11px;opacity:${unlocked ? 0.75 : 0.35};">${b.desc}</div>
    </div>`;
  }).join("");
  return `
    ${topBarHtml({ showBack: true, backAction: "go-home" })}
    <h2 class="display" style="font-size:20px;margin-bottom:16px;">Badge Collection</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">${itemsHtml}</div>
  `;
}

function render() {
  const app = document.getElementById("app");
  let html;
  switch (state.screen) {
    case "setup": html = renderSetup(); break;
    case "new-student": html = renderSetup(); break;
    case "roster": html = renderRoster(); break;
    case "admin-login": html = renderAdminLogin(); break;
    case "admin-dashboard": html = renderAdminDashboard(); break;
    case "home": html = renderHome(); break;
    case "trail-math": html = renderTrail("math"); break;
    case "trail-reading": html = renderTrail("reading"); break;
    case "learning-path-math": html = renderLearningPath("math"); break;
    case "learning-path-reading": html = renderLearningPath("reading"); break;
    case "progress-report-math": html = renderProgressReport("math"); break;
    case "progress-report-reading": html = renderProgressReport("reading"); break;
    case "quiz": html = renderQuiz(); break;
    case "results": html = renderResults(); break;
    case "badges": html = renderBadges(); break;
    default: html = "";
  }
  app.innerHTML = html;
}

/* ------------------------------ event wiring ------------------------------ */

document.addEventListener("DOMContentLoaded", () => {
  const app = document.getElementById("app");

  app.addEventListener("input", (e) => {
    if (e.target.id === "name-input") {
      state.setupName = e.target.value;
    }
    if (e.target.id === "admin-pin-input") {
      state.adminPinInput = e.target.value;
    }
  });

  app.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;
    switch (action) {
      case "pick-avatar": state.setupAvatar = el.dataset.avatar; render(); break;
      case "start-adventure": createStudent(); break;
      case "go-new-student": state.setupName = ""; state.setupAvatar = AVATARS[0]; state.screen = "new-student"; render(); break;
      case "switch-student": switchToStudent(el.dataset.student); break;
      case "go-roster": state.screen = "roster"; render(); break;
      case "go-home": state.screen = "home"; render(); break;
      case "go-admin-login": state.adminPinInput = ""; state.adminError = ""; state.screen = "admin-login"; render(); break;
      case "admin-pin-submit": checkAdminPin(); break;
      case "admin-refresh": loadAdminDashboard(); break;
      case "go-trail-math": state.screen = "trail-math"; render(); break;
      case "go-trail-reading": state.screen = "trail-reading"; render(); break;
      case "go-learning-path-math": state.screen = "learning-path-math"; render(); break;
      case "go-learning-path-reading": state.screen = "learning-path-reading"; render(); break;
      case "go-progress-report-math": state.screen = "progress-report-math"; render(); break;
      case "go-progress-report-reading": state.screen = "progress-report-reading"; render(); break;
      case "go-badges": state.screen = "badges"; render(); break;
      case "start-quiz": startQuiz(el.dataset.topic); break;
      case "start-practice": startPractice(el.dataset.topic); break;
      case "start-unit-test": startUnitTest(el.dataset.topic); break;
      case "retry-unit-test": startUnitTest(state.activeTopic.id); break;
      case "exit-quiz": state.screen = (state.unitTestMode || state.fromLearningPath) ? `learning-path-${state.activeTopic.subject}` : (state.activeTopic.subject === "math" ? "trail-math" : "trail-reading"); render(); break;
      case "select-option": selectOption(el.dataset.value); break;
      case "next-question": nextQuestion(); break;
      case "play-again": startQuiz(state.activeTopic.id); break;
      case "back-to-map": state.screen = state.activeTopic.subject === "math" ? "trail-math" : "trail-reading"; render(); break;
      case "reset-progress": resetProgress(); break;
      case "email-report": emailProgressReport(); break;
      case "set-grade": {
        state.grade = parseInt(el.dataset.grade, 10);
        state.profile.grade = state.grade;
        state.students = state.students.map((s) => (s.id === state.profile.id ? { ...s, grade: state.grade } : s));
        saveStudents(state.students);
        cloudSync(() => upsertStudentCloud(state.profile));
        render();
        break;
      }
    }
  });

  state.students = migrateLegacyProfileIfNeeded();
  if (state.students.length === 0) state.students = loadStudents();
  const activeId = loadActiveStudentId();
  const activeStudent = state.students.find((s) => s.id === activeId) || state.students[0] || null;
  if (activeStudent) {
    state.profile = activeStudent;
    state.grade = activeStudent.grade || 3;
    state.progress = loadProgressForStudent(activeStudent.id) || { totalStars: 0, topics: {}, units: {}, badges: [], bestStreak: 0 };
    if (!state.progress.units) state.progress.units = {}; // migrate older saves
    state.screen = "home";
  } else {
    state.screen = "new-student";
  }
  render();
});
</script>
</body>
</html>
